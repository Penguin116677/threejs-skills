<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>touch grass — motion</title>
    <meta name="description" content="touch grass — a 20 second motion piece." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="stage" aria-label="touch grass: a looping film of a hill and a tree from day to night">
      <canvas id="scene"></canvas>

      <div class="titles">
        <h1 class="title">touch grass</h1>
        <p class="sub">without leaving your desk</p>
      </div>

      <div class="clock" aria-hidden="true"><span class="clock-time">1:00</span><span class="clock-ampm">pm</span></div>

      <div class="fade" aria-hidden="true"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
