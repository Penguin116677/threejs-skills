<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe0f5" />
    <title>touch grass</title>
    <meta name="description" content="touch grass — without leaving your desk." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233f8f2a' d='M20 3C9 3 4 9 4 16c0 1.5.3 3 .8 4l1.6-1.2C8 13 12 9.5 16 8c-3.6 2.4-6.6 6-8.2 11.6C17.5 20.6 21 13 20 3Z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="A grassy hill with a tree. Drag horizontally to change the time of day."></canvas>

    <div id="ui">
      <nav class="nav fade" id="nav">
        <a class="brand" href="#" aria-label="touch grass home">
          <svg class="leaf" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 3C9 3 4 9 4 16c0 1.5.3 3 .8 4l1.6-1.2C8 13 12 9.5 16 8c-3.6 2.4-6.6 6-8.2 11.6C17.5 20.6 21 13 20 3Z" />
          </svg>
          <span>touch grass</span>
        </a>
        <div class="links">
          <a href="#biomes" data-action="biomes">biomes</a>
          <a href="#how-it-works" data-action="how">how it works</a>
        </div>
      </nav>

      <header class="hero fade" id="hero">
        <h1>touch grass</h1>
        <p class="sub">without leaving your desk</p>
        <button class="pill" id="start-break" type="button">try a break</button>
      </header>

      <div class="break-pill" id="break-pill" aria-live="polite" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span>break <b id="break-time">1:00</b></span>
        <button type="button" id="end-break">end</button>
      </div>

      <aside class="card" id="how-card" role="dialog" aria-label="how it works" hidden>
        <p><b>drag sideways</b> anywhere to move the sun — day, dusk, night.</p>
        <p><b>brush the grass</b> with your cursor or finger and watch it bend.</p>
        <p><b>try a break</b> for sixty quiet seconds. fireflies come out at night.</p>
      </aside>

      <div class="toast" id="toast" role="status"></div>

      <div class="hint fade" id="hint" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V10m0-.5a1.5 1.5 0 0 1 3 0v4.5c0 3.6-2.4 6-6 6h-1c-2.2 0-3.6-.9-4.8-2.6L3.6 13.6a1.5 1.5 0 0 1 2.3-1.9L9 14.5" /></svg>
        <span>drag to change the time</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
